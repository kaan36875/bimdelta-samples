name: BIMDelta

on:
  pull_request:
    paths: ["**/*.ifc", "**/*.IFC"]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: kaan36875/BIMDelta/apps/github-action@v0.9.0
